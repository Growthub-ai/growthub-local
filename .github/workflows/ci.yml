name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Freeze boundary check
        run: bash scripts/freeze-check.sh

      - name: Validate package version policy
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/check-version-sync.mjs --require-bump-if-source-changed --base "$BASE_SHA" --head "$HEAD_SHA"

      - name: Validate shipped CLI package contracts
        run: node scripts/check-cli-package.mjs

      - name: Validate bundled worker kit contracts
        run: node scripts/check-worker-kits.mjs

      - name: Validate Claude Code plugin marketplace surface
        run: node scripts/check-claude-plugin.mjs

      - name: Validate Codex plugin marketplace surface
        run: node scripts/check-codex-plugin.mjs

      - name: Validate resolver registry (drift guard + unit tests)
        run: |
          node scripts/check-resolver-registry.mjs
          node --test scripts/unit-resolver-registry.test.mjs

      - name: Validate workspace metadata blast-radius deriver
        run: node --test scripts/unit-workspace-metadata-impact.test.mjs

      - name: Validate custom-model training runtime (incl. start-training gate)
        run: |
          node --test scripts/unit-training-runtime.test.mjs
          node --test scripts/unit-training-ledger.test.mjs

      - name: Validate distillation flywheel (gateway, adaptive plan, sparse MoE, proxy routing)
        run: |
          node --test scripts/unit-distillation-flywheel.test.mjs
          node scripts/e2e-distillation-flywheel-loop.mjs

      - name: Validate governed inference control plane and evidentiary backbone
        # Canonical certification command (same entrypoint as local runs).
        # Provisions the exact pinned AJV validator set from the committed
        # scripts/certification-deps manifest + lockfile (npm ci, lifecycle
        # scripts disabled), then runs the inference control-plane,
        # evidentiary-backbone, and route-wiring suites. Any provisioning or
        # suite failure fails this job — there is no skip lane.
        run: npm run test:inference-certification

      - name: Certify governed compute realization
        # Canonical unconditional gate: contract, profiles, registry, resolver,
        # execution, all provider adapters, customer state, adversarial cases,
        # route wiring, booted durable route loop, and composed proof loop.
        run: npm run test:compute-certification

      - name: Validate workspace add-ons scheduler loop
        run: |
          node --test scripts/unit-workspace-add-ons-scheduler.test.mjs
          node --test scripts/unit-scheduler-orchestration.test.mjs
          node --test scripts/unit-serverless-readiness.test.mjs
          node --test scripts/unit-schedule-cockpit.test.mjs

      - name: Validate Supabase provider + external data sync loop
        run: |
          node --test scripts/unit-workspace-add-ons-supabase.test.mjs
          node --test scripts/unit-supabase-data-node.test.mjs
          node --test scripts/unit-workspace-external-sync.test.mjs
          node --test scripts/unit-supabase-provider-hardening.test.mjs
          node --test scripts/unit-external-data-causation.test.mjs
          node --test scripts/unit-workspace-storage-buckets.test.mjs

      - name: Validate marketplace provider suites
        run: |
          npm run test:add-ons-vercel
          npm run test:add-ons-nango
          npm run test:add-ons-stripe
          npm run test:add-ons-resend
          npm run test:add-ons-neon
          npm run test:add-ons-cloudflare
          npm run test:capability-nodes
          npm run test:capability-surfaces

      - name: Validate Fork Sync Agent kernel packet
        run: node scripts/check-fork-sync.mjs

      - name: Validate release packaging
        run: node scripts/release-check.mjs

name: Apply compute network integration

on:
  push:
    branches:
      - claude/compute-authority-evidence-pr296-0u5msd

permissions:
  contents: write

concurrency:
  group: apply-compute-network-integration
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: claude/compute-authority-evidence-pr296-0u5msd

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply surgical integration to the exact branch head
        run: node scripts/apply-compute-network-integration.mjs

      - name: Verify formatting and the complete compute certification
        run: |
          git diff --check
          npm run test:compute-certification

      - name: Commit the green integration and remove patch machinery
        shell: bash
        run: |
          git config user.name "growthub-compute-integration"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(compute): enforce canonical outbound policy in production"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"

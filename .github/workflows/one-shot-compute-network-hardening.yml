name: One-shot compute production hardening

on:
  workflow_dispatch:
  push:
    branches:
      - claude/compute-authority-evidence-pr296-0u5msd
    paths:
      - .github/workflows/one-shot-compute-network-hardening.yml
      - scripts/repair-compute-network-script.mjs
      - scripts/apply-compute-network-hardening.mjs
      - scripts/repair-compute-data-plane-script.mjs
      - scripts/apply-compute-data-plane.mjs
      - scripts/finalize-compute-data-plane.mjs
      - scripts/apply-compute-durable-data-store.mjs
      - scripts/apply-compute-provider-attestation.mjs
      - scripts/apply-compute-allocation-idempotency.mjs
      - scripts/apply-compute-canonical-evaluation.mjs
      - scripts/finalize-compute-evaluation-order.mjs
      - scripts/apply-compute-canonical-e2e.mjs
      - scripts/apply-compute-observation-hardening.mjs
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: write

concurrency:
  group: one-shot-compute-production-hardening
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          show-progress: false
          ref: claude/compute-authority-evidence-pr296-0u5msd

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Make network applicator current-head idempotent
        run: node scripts/repair-compute-network-script.mjs

      - name: Apply governed network and resource-lifecycle wiring
        run: node scripts/apply-compute-network-hardening.mjs

      - name: Tighten the data-plane applicator
        run: node scripts/repair-compute-data-plane-script.mjs

      - name: Apply signed remote corpus data plane
        run: node scripts/apply-compute-data-plane.mjs

      - name: Finalize dataset capability and delivery invariants
        run: node scripts/finalize-compute-data-plane.mjs

      - name: Bind data plane to durable deployment storage
        run: node scripts/apply-compute-durable-data-store.mjs

      - name: Require provider work-spec and corpus attestation
        run: node scripts/apply-compute-provider-attestation.mjs

      - name: Require deterministic paid-allocation reconciliation
        run: node scripts/apply-compute-allocation-idempotency.mjs

      - name: Apply workspace-owned canonical evaluation wiring
        run: node scripts/apply-compute-canonical-evaluation.mjs

      - name: Release paid capacity before canonical evaluation
        run: node scripts/finalize-compute-evaluation-order.mjs

      - name: Apply canonical evaluation to the booted route proof
        run: node scripts/apply-compute-canonical-e2e.mjs

      - name: Apply governed long-run observation continuation
        run: node scripts/apply-compute-observation-hardening.mjs

      - name: Verify focused network policy
        run: node --test scripts/unit-compute-network-policy.test.mjs

      - name: Verify single outbound-policy authority
        run: node --test scripts/unit-compute-outbound-policy.test.mjs

      - name: Verify signed remote corpus data plane
        run: node --test scripts/unit-compute-data-plane.test.mjs

      - name: Verify durable compute data stores
        run: node --test scripts/unit-compute-data-store.test.mjs

      - name: Verify provider artifact attestation
        run: node --test scripts/unit-compute-provider-attestation.test.mjs

      - name: Verify paid-allocation crash reconciliation
        run: |
          node --test scripts/unit-compute-allocation-idempotency.test.mjs
          node --test scripts/unit-compute-allocation-reconciliation.test.mjs

      - name: Verify focused Runpod release policy
        run: node --test scripts/unit-compute-runpod-release.test.mjs

      - name: Verify workspace-owned canonical evaluation
        run: node --test scripts/unit-compute-canonical-evaluation.test.mjs

      - name: Verify release-before-evaluation ordering
        run: node --test scripts/unit-compute-evaluation-order.test.mjs

      - name: Verify governed long-run observation wiring
        run: node --test scripts/unit-compute-observation-wiring.test.mjs

      - name: Verify full compute certification
        run: npm run test:compute-certification

      - name: Verify repository formatting
        run: git diff --check

      - name: Commit implementation to the active PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cli/assets/worker-kits/growthub-custom-workspace-starter-v1/apps/workspace/app/api/workspace/sandbox-run/route.js \
                  cli/assets/worker-kits/growthub-custom-workspace-starter-v1/apps/workspace/app/api/workspace/compute-data/[token]/route.js \
                  cli/assets/worker-kits/growthub-custom-workspace-starter-v1/apps/workspace/app/data-model/components/TrainingHandoffModal.jsx \
                  cli/assets/worker-kits/growthub-custom-workspace-starter-v1/apps/workspace/lib/custom-model-inference.js \
                  cli/assets/worker-kits/growthub-custom-workspace-starter-v1/apps/workspace/lib/compute-execution.js \
                  cli/assets/worker-kits/growthub-custom-workspace-starter-v1/apps/workspace/lib/compute-evidence.js \
                  cli/assets/worker-kits/growthub-custom-workspace-starter-v1/apps/workspace/lib/compute-resolver.js \
                  cli/assets/worker-kits/growthub-custom-workspace-starter-v1/apps/workspace/lib/compute-network-policy.js \
                  cli/assets/worker-kits/growthub-custom-workspace-starter-v1/apps/workspace/lib/compute-data-plane.js \
                  cli/assets/worker-kits/growthub-custom-workspace-starter-v1/apps/workspace/lib/compute-data-store.js \
                  cli/assets/worker-kits/growthub-custom-workspace-starter-v1/apps/workspace/lib/training-dataset.js \
                  cli/assets/worker-kits/growthub-custom-workspace-starter-v1/apps/workspace/lib/compute-canonical-evaluation.js \
                  cli/assets/worker-kits/growthub-custom-workspace-starter-v1/apps/workspace/lib/adapters/compute/compute-adapter-registry.js \
                  cli/assets/worker-kits/growthub-custom-workspace-starter-v1/apps/workspace/lib/adapters/compute/modal-compute.js \
                  cli/assets/worker-kits/growthub-custom-workspace-starter-v1/apps/workspace/lib/adapters/compute/runpod-compute.js \
                  cli/assets/worker-kits/growthub-custom-workspace-starter-v1/apps/workspace/lib/adapters/compute/ray-cluster-compute.js \
                  scripts/e2e-compute-route-realization-loop.mjs \
                  scripts/apply-compute-canonical-e2e.mjs \
                  scripts/run-compute-certification.mjs
          if git diff --cached --quiet; then
            echo "[one-shot] branch already contains the hardened implementation"
            exit 0
          fi
          git commit -m "fix(compute): close governed network, durable data, allocation, evaluation, and observation loops"
          git push origin HEAD:claude/compute-authority-evidence-pr296-0u5msd
